name: Build Triton Image

on:
  push:
    branches: [main]
    paths:
      - 'triton/Dockerfile'   # Dockerfile 변경 시에만 트리거
  workflow_dispatch:           # 수동 실행 (최초 이미지 생성 시 사용)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 메타데이터 추출 (태그 · 레이블)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tritonserver-gemma
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Docker Buildx 설정 (레이어 캐시 활성화)
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & Docker Hub 푸시
        uses: docker/build-push-action@v6
        with:
          context: triton
          file: triton/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
