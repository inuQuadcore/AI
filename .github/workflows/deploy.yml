name: Deploy to GPU Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: GPU 서버 배포 (Bastion 경유)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # ── 실제 서버 (laurel) ──
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          # ── Bastion 서버 (almond) ──
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_port: ${{ secrets.BASTION_PORT }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            # model_repository 동기화
            cd ~/hdd
            git -C capston/AI pull origin main

            # Triton 이미지 pull & 재시작
            docker pull nvcr.io/nvidia/tritonserver:24.12-py3
            docker-compose up -d --force-recreate triton

            # 헬스체크 (최대 120초 대기)
            echo "Triton 기동 대기 중..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8000/v2/health/ready; then
                echo "✅ Triton READY: $(date)"
                break
              fi
              echo "  대기 중... ($((i * 5))s)"
              sleep 5
            done

            docker image prune -f
