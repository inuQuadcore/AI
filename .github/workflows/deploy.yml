name: Deploy to GPU Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: docker-compose.yml 서버로 복사 (Bastion 경유)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_port: ${{ secrets.BASTION_PORT }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "~/hdd/"

      - name: model_repository 서버로 복사 (Bastion 경유)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_port: ${{ secrets.BASTION_PORT }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "triton/model_repository"
          target: "~/hdd/capston/"   # → ~/hdd/capston/triton/model_repository (MODEL_REPO_PATH와 일치)

      - name: GPU 서버 배포 (Bastion 경유)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_port: ${{ secrets.BASTION_PORT }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd ~/hdd

            TRITON_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/tritonserver-gemma:latest"

            # 커스텀 이미지 pull
            docker pull "${TRITON_IMAGE}"

            # TRITON_IMAGE를 주입하여 재시작
            TRITON_IMAGE="${TRITON_IMAGE}" docker-compose up -d --force-recreate triton

            # 헬스체크 (최대 120초 대기)
            echo "Triton 기동 대기 중..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8000/v2/health/ready; then
                echo "✅ Triton READY: $(date)"
                break
              fi
              echo "  대기 중... ($((i * 5))s)"
              sleep 5
            done

            docker image prune -f
